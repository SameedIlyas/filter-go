# Local development Postgres. Not for production.
# Dev DB:  postgresql://filter:filter@localhost:5433/filter_portal
# Test DB: postgresql://filter:filter@localhost:5433/filter_portal_test
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filter
      POSTGRES_PASSWORD: filter
      POSTGRES_DB: filter_portal
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U filter -d filter_portal']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
